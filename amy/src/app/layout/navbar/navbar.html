<!--
  AMY_ENGINE_UI: NAVBAR CORE
  VERSION: ULTRA_INSANO_GOD_TIER
  ESTADO: ONLINE_Y_OPERATIVO
-->
<nav class="navbar navbar-expand-lg fixed-top amy-navbar"
     [class.navbar-scrolled]="isScrolled()"
     data-aos="fade-down"
     data-aos-duration="1000">

  <div class="container">

    <!-- BRAND // LOGO HEXAGONAL -->
    <a class="navbar-brand d-flex align-items-center" routerLink="/" (click)="closeMenu()">
      <div class="brand-hex">AMY</div>
      <div class="brand-text-wrapper ms-2">
        <span class="brand-main-text">DIGITAL</span>
        <span class="brand-sub-text">// AGENCY</span>
      </div>
      <span class="status-pulse ms-2" title="Sistema Activo"></span>
    </a>

    <!-- TOGGLER MÓVIL CYBERPUNK -->
    <button class="navbar-toggler border-0 shadow-none"
            type="button"
            (click)="toggleMenu()"
            [attr.aria-expanded]="!isMenuCollapsed">
      <span class="toggler-icon-custom" [class.open]="!isMenuCollapsed"></span>
    </button>

    <!-- MATRIZ DE NAVEGACIÓN -->
    <div class="collapse navbar-collapse" [class.show]="!isMenuCollapsed" id="navbarNav">
      <ul class="navbar-nav ms-auto align-items-center gap-lg-3">

        <li class="nav-item">
          <a class="nav-link-pro" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" (click)="closeMenu()">
            <span class="nav-number">01</span> INICIO
          </a>
        </li>

        <!-- NODO: SERVICIOS (DROPDOWN CON HOVER) -->
        <li class="nav-item dropdown">
          <a class="nav-link-pro dropdown-toggle" routerLink="/servicios" routerLinkActive="active" role="button" data-bs-toggle="dropdown">
            <span class="nav-number">02</span> SERVICIOS
          </a>
          <ul class="dropdown-menu dropdown-cyber">
            <li><a class="dropdown-item" routerLink="/servicios/tiendas-online" (click)="closeMenu()">E-COMMERCE</a></li>
            <li><a class="dropdown-item" routerLink="/servicios/sitios-corporativos" (click)="closeMenu()">CORPORATIVOS</a></li>
            <li><a class="dropdown-item" routerLink="/servicios/landing-pages" (click)="closeMenu()">LANDING_PAGES</a></li>
            <li><a class="dropdown-item" routerLink="/servicios/mantenimiento-web" (click)="closeMenu()">MANTENIMIENTO</a></li>
            <li><hr class="dropdown-divider border-secondary opacity-25"></li>
            <li><a class="dropdown-item text-neon" routerLink="/servicios" (click)="closeMenu()">EXPLORAR_TODOS</a></li>
          </ul>
        </li>

        <!-- NODO: PORTAFOLIO -->
        <li class="nav-item">
          <a class="nav-link-pro" routerLink="/portafolio" routerLinkActive="active" (click)="closeMenu()">
            <span class="nav-number">03</span> PORTAFOLIO
          </a>
        </li>

        <!-- NODO: BLOG -->
        <li class="nav-item">
          <a class="nav-link-pro" routerLink="/blog" routerLinkActive="active" (click)="closeMenu()">
            <span class="nav-number">04</span> BLOG
          </a>
        </li>

        <!-- NODO: NOSOTROS -->
        <li class="nav-item">
          <a class="nav-link-pro" routerLink="/nosotros" routerLinkActive="active" (click)="closeMenu()">
            <span class="nav-number">05</span> NOSOTROS
          </a>
        </li>

        <!-- ZONA DE ACCIÓN: TERMINALES -->
        <li class="nav-item d-flex align-items-center gap-3 ms-lg-4 mt-4 mt-lg-0">

          <!-- TERMINAL: PORTAL CLIENTES -->
          <a class="btn-portal-client" routerLink="/portal-cliente" (click)="closeMenu()" title="Acceso a Servidores">
            <i class="fa-solid fa-terminal"></i> <span class="d-lg-none ms-2">PORTAL_CLIENTES</span>
          </a>

          <!-- TERMINAL: CONTACTO DIRECTO -->
          <button class="btn-navbar-pro" routerLink="/contacto" (click)="closeMenu()">
            CONTACTO_NODO <i class="fa-solid fa-bolt ms-2"></i>
          </button>

        </li>

      </ul>
    </div>
  </div>
</nav>
